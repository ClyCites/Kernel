services:
  postgres:
    # Multi-arch mirror of postgis/postgis, which publishes amd64 only.
    # See docs/decisions/0004-postgis-image.md.
    image: imresamu/postgis:16-3.5
    container_name: clycites-kernel-db
    environment:
      POSTGRES_USER: clycites_owner
      POSTGRES_PASSWORD: clycites_owner_dev_only
      POSTGRES_DB: clycites
    ports:
      # Loopback only. A bare "5433:5432" publishes on every interface the host
      # has, which on most VPS images means the open internet. Reach it from
      # elsewhere with an SSH tunnel, never by widening this.
      # Asserted in apps/kernel/test/ops/exposure.test.ts.
      - "127.0.0.1:5433:5432"
    volumes:
      - kernel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clycites_owner -d clycites"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Object storage for media (work order H), reached over the S3 API.
  #
  # MinIO, pinned to the last release its owner published before archiving the
  # open-source server repository. This reverses 0037 and the reasons that
  # decision gave still hold: there is no security-patch path for this image.
  # docs/decisions/0040-minio.md records who accepted that and on what terms.
  #
  # Nothing in the kernel names MinIO. It speaks S3 and only the subset every
  # implementation actually has, which is what makes the swap four variables.
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: clycites-kernel-objects
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clycites_media_dev_only
      MINIO_ROOT_PASSWORD: clycites_media_dev_only_secret
    ports:
      # Loopback only, for the same reason postgres is. A bucket published on
      # every interface is a bucket on the open internet, and the objects in
      # this one are the most sensitive artifacts the system holds.
      # Asserted in apps/kernel/test/ops/exposure.test.ts.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - kernel-objects-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 20s
      retries: 10

  # Garage created the bucket from environment variables and had no ACLs to get
  # wrong. MinIO has both, so both are done here explicitly — and `anonymous set
  # none` is not redundant belt-and-braces, it is the line that keeps a public
  # bucket from being one console click away.
  minio-init:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: clycites-kernel-objects-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set kernel http://minio:9000
        clycites_media_dev_only clycites_media_dev_only_secret &&
        mc mb --ignore-existing kernel/clycites-media &&
        mc anonymous set none kernel/clycites-media

volumes:
  kernel-pgdata:
  kernel-objects-data:
