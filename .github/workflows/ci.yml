name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # The committed contract is generated. If it drifts from the schemas,
      # applications are coding against a document that is no longer true.
      - run: pnpm openapi
      - run: git diff --exit-code apps/kernel/openapi.json

      # Integration tests start their own Postgres via Testcontainers, which
      # needs the Docker daemon the runner already provides.
      - run: pnpm test
