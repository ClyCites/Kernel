name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheap and first: a credential in the tree is worth failing the build
      # before anything else has had a chance to log it.
      - run: pnpm check:secrets

      - run: pnpm typecheck

      - run: pnpm lint

      # The committed contract is generated. If it drifts from the schemas,
      # applications are coding against a document that is no longer true.
      - run: pnpm openapi
      - run: git diff --exit-code apps/kernel/openapi.json

      - run: pnpm --filter @clycites/api-client run generate
      - run: git diff --exit-code packages/api-client/src/generated.ts

      - run: pnpm openapi:check-breaking:test
      - run: pnpm openapi:check-breaking
        env:
          BREAKING_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') && '1' || '0' }}

      # Integration tests start their own Postgres via Testcontainers, which
      # needs the Docker daemon the runner already provides. That includes the
      # restore test, which runs scripts/backup.sh and scripts/restore.sh inside
      # the container — an untested backup is a belief, not a backup.
      - run: pnpm test
