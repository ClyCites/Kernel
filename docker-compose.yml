services:
  postgres:
    # Multi-arch mirror of postgis/postgis, which publishes amd64 only.
    # See docs/decisions/0004-postgis-image.md.
    image: imresamu/postgis:16-3.5
    container_name: clycites-kernel-db
    environment:
      POSTGRES_USER: clycites_owner
      POSTGRES_PASSWORD: clycites_owner_dev_only
      POSTGRES_DB: clycites
    ports:
      # Loopback only. A bare "5433:5432" publishes on every interface the host
      # has, which on most VPS images means the open internet. Reach it from
      # elsewhere with an SSH tunnel, never by widening this.
      # Asserted in apps/kernel/test/ops/exposure.test.ts.
      - "127.0.0.1:5433:5432"
    volumes:
      - kernel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clycites_owner -d clycites"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Object storage for media (work order H), reached over the S3 API.
  #
  # Garage rather than MinIO. MinIO's open-source server repository was
  # archived by its owner in April 2026 and has had no release since October
  # 2025 — the last of those was itself a privilege-escalation CVE fix. Running
  # photographs of farmers' homesteads on a storage server with no
  # security-patch path is not defensible. See docs/decisions/0037-p5-media.md
  # for the comparison and for what a later swap would cost.
  #
  # Nothing in the kernel names Garage. It speaks S3 and only the subset every
  # implementation actually has.
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: clycites-kernel-objects
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: clycites_media_dev_only
      GARAGE_DEFAULT_SECRET_KEY: clycites_media_dev_only_secret
      GARAGE_DEFAULT_BUCKET: clycites-media
    command: ["/garage", "server", "--single-node"]
    ports:
      # Loopback only, for the same reason postgres is. A bucket published on
      # every interface is a bucket on the open internet, and the objects in
      # this one are the most sensitive artifacts the system holds.
      # Asserted in apps/kernel/test/ops/exposure.test.ts.
      - "127.0.0.1:3900:3900"
    volumes:
      - kernel-objects-data:/var/lib/garage/data
      - kernel-objects-meta:/var/lib/garage/meta

volumes:
  kernel-pgdata:
  kernel-objects-data:
  kernel-objects-meta:
