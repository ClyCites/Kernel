x-kernel-image: &kernel-image
  image: clycites-kernel:${KERNEL_IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile

x-runtime-defaults: &runtime-defaults
  NODE_ENV: production
  SEED_INGEST_ENABLED: "false"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PARTITION_MONTHS_AHEAD: ${PARTITION_MONTHS_AHEAD:-24}
  S9_CONSENT_REQUIRED_FOR_MEMBER_BODY: "true"

services:
  postgres:
    image: imresamu/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: clycites_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: clycites
    volumes:
      - kernel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clycites_owner -d clycites"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in Coolify}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in Coolify}
    volumes:
      - kernel-objects-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 20s
      retries: 10

  minio-init:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in Coolify}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in Coolify}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set kernel http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing kernel/clycites-media &&
        mc anonymous set none kernel/clycites-media

  migrate:
    <<: *kernel-image
    restart: "no"
    command: ["node", "dist/src/storage/migrate-cli.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *runtime-defaults
      DATABASE_URL: postgres://kernel_app:${KERNEL_APP_PASSWORD}@postgres:5432/clycites
      MIGRATOR_DATABASE_URL: postgres://clycites_owner:${POSTGRES_PASSWORD}@postgres:5432/clycites
      KERNEL_APP_PASSWORD: ${KERNEL_APP_PASSWORD:?Set KERNEL_APP_PASSWORD in Coolify}
      KERNEL_TRAINING_PASSWORD: ${KERNEL_TRAINING_PASSWORD:?Set KERNEL_TRAINING_PASSWORD in Coolify}

  kernel:
    <<: *kernel-image
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    environment:
      <<: *runtime-defaults
      PORT: 3000
      DATABASE_URL: postgres://kernel_app:${KERNEL_APP_PASSWORD}@postgres:5432/clycites
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_S3_BUCKET: clycites-media
      MEDIA_S3_REGION: minio
      MEDIA_S3_PATH_STYLE: "true"
      MEDIA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in Coolify}
      MEDIA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in Coolify}
      AUDIT_SHIP_URL: ${AUDIT_SHIP_URL:-}
      AUDIT_SHIP_TOKEN: ${AUDIT_SHIP_TOKEN:-}
      ANCHOR_NETWORK: ${ANCHOR_NETWORK:-testnet}
      ANCHOR_TOPIC_ID: ${ANCHOR_TOPIC_ID:-}
      ANCHOR_OPERATOR_ID: ${ANCHOR_OPERATOR_ID:-}
      ANCHOR_OPERATOR_KEY: ${ANCHOR_OPERATOR_KEY:-}
      ANCHOR_MAINNET_ACKNOWLEDGED: ${ANCHOR_MAINNET_ACKNOWLEDGED:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/v1/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  kernel-pgdata:
  kernel-objects-data: