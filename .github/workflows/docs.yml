# The site is generated from two things the repository already holds: the
# markdown under docs/, and openapi.json. Neither is hand-copied here, because a
# hand-copied API reference drifts within a fortnight and then actively
# misleads.
#
# The build runs on every push and pull request as a required check. A broken
# internal link fails it — see `--strict` below — because a documentation site
# that rots silently is worse than none.
name: docs

on:
  push:
    branches: [staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # mike writes to gh-pages and needs the history to do it.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Both generators import @clycites/schema by its package entry point,
      # which resolves to dist. On a clean checkout that does not exist yet.
      - run: pnpm build

      # The generated pages are committed, so that the site can be built without
      # a Node toolchain and so that a schema change shows up as a documentation
      # diff in review rather than appearing silently at deploy time.
      - name: Reference pages are up to date
        run: |
          pnpm docs:reference
          git diff --exit-code docs/reference \
            || { echo "::error::docs/reference is stale — run 'pnpm docs:reference' and commit"; exit 1; }

      - name: The API document is up to date
        run: |
          pnpm openapi
          git diff --exit-code apps/kernel/openapi.json \
            || { echo "::error::openapi.json is stale — run 'pnpm openapi' and commit"; exit 1; }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - run: pip install -r requirements-docs.txt

      # --strict turns warnings into failures: broken internal links, missing
      # anchors, pages absent from the nav.
      - run: mkdocs build --strict

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 14

  # mike keeps every published version readable, so kernel-v1.0.0 survives v0.3
  # of the schema landing and the concepts pages moving on. It publishes to the
  # gh-pages branch, which is why this job needs contents: write and the full
  # history.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No Node here: everything generated is committed, and the build job has
      # already failed the run if any of it had drifted.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt

      - name: Publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mike deploy --push --update-aliases "${DOCS_VERSION}" latest
          mike set-default --push latest
        env:
          # There is no released version of this documentation yet. When one is
          # cut, this becomes the tag and "dev" carries on alongside it.
          DOCS_VERSION: dev
